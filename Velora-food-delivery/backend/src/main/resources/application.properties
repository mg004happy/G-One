
server.port=${PORT:8080}

# --- PostgreSQL Datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/velora_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Mtc@1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Apply additive, versioned PostgreSQL migrations before Hibernate updates the
# remaining entity schema. Baseline existing databases so the new migration can
# safely add its columns and tie-up table without replaying an initial schema.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=${JWT_SECRET:fACizkz8pB/5biKsWBa0Yn9bbVdkb+FHiZ2nB1+Ou4k=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
